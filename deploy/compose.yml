name: tradingapp
services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set to a versioned image}
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-80}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
